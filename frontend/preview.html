<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>DutyOn dock preview</title>
<style>
  /* Ghost outline of the upcoming edge-dock snap. The window itself is
     transparent and click-through (owned by Rust); this page only paints
     the semi-transparent dashed silhouette. */
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
  }
  #ghost {
    position: absolute;
    inset: 1px;
    border: 2px dashed rgba(124, 108, 248, 0.9);
    border-radius: 14px;
    background: rgba(124, 108, 248, 0.15);
    box-shadow: 0 0 16px rgba(124, 108, 248, 0.35),
                inset 0 0 12px rgba(124, 108, 248, 0.12);
  }
</style>
</head>
<body>
  <div id="ghost"></div>
</body>
</html>
