<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duty On</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
  <!-- Early diagnostic forwarder: POSTs JS errors to our HTTP server's /log
       endpoint. Runs before all other scripts so it catches errors in
       tauri-bridge.js / renderer.js. Uses plain fetch (no __TAURI__
       dependency) so it works even if the Tauri global isn't injected. -->
  <script>
  (function () {
    var LOG_URL = 'http://127.0.0.1:17521/log';
    function sendLog(level, msg) {
      try {
        fetch(LOG_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ level: level, msg: msg })
        }).catch(function () {});
      } catch (e) {}
    }
    window.addEventListener('error', function (e) {
      sendLog('error', '[uncaught] ' + (e.message || '') +
        (e.filename ? ' @ ' + e.filename + ':' + e.lineno : ''));
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      sendLog('error', '[unhandled] ' + (r && r.message ? r.message : String(r)));
    });
    window.__petSendLog = sendLog;
  })();
  </script>

  <!-- Main pet container -->
  <div id="pet-container">
    <!-- Live2D canvas area -->
    <div id="canvas-wrapper">
      <div id="live2d-canvas"></div>
      <!-- Fallback canvas (shown if Live2D fails to load) -->
      <canvas id="fallback-canvas" width="280" height="320" style="display:none;"></canvas>
      <!-- Head-top effects (ZZZ / working dots / !) anchored to the model's
           bounds top-center; inset and size scale with the model's height. -->
      <div id="head-effect" class="head-effect"></div>
    </div>

    <!-- Status bar -->
    <div id="status-bar">
      <div id="status-header">
        <span id="pet-state-text" data-i18n="status.initializing">初始化中...</span>
        <button id="menu-btn" title="菜单">&#9776;</button>
      </div>
      <div id="project-list">
        <div class="project-item empty">等待 Trae IDE 连接...</div>
      </div>
    </div>
  </div>

  <!-- Context menu (main view + secondary submenus) -->
  <div id="context-menu" class="hidden">
    <!-- Main view -->
    <div id="menu-main-view">
      <div class="menu-item submenu-trigger" id="menu-models-trigger">
        <span data-i18n="menu.switchModel">切换形象</span><span class="submenu-arrow">▶</span>
      </div>
      <div class="menu-item" id="menu-upload-live2d" data-i18n="menu.uploadLive2D">上传 Live2D 模型</div>
      <div class="menu-item submenu-trigger" id="menu-play-motion">
        <span data-i18n="menu.playMotion">播放动作</span><span class="submenu-arrow">▶</span>
      </div>
      <div class="menu-item submenu-trigger" id="menu-settings-trigger">
        <span data-i18n="menu.actionSettings">动作设定</span><span class="submenu-arrow">▶</span>
      </div>
      <div class="menu-item" id="menu-flip" data-i18n="menu.flipHorizontal">左右翻转</div>
      <div class="menu-item" id="menu-mini-mode" data-i18n="menu.miniMode">迷你模式</div>
      <div class="menu-item" id="menu-auto-launch" data-i18n="menu.autoLaunch">开机自启动</div>
      <!-- 外接显示屏功能暂时隐藏（允许外部访问 + 打开声音文件夹）；
           恢复时去掉下面两项的 hidden 属性即可，JS 逻辑无需改动。 -->
      <div class="menu-item" id="menu-external-access" data-i18n="menu.externalAccess" hidden>允许外部访问</div>
      <div class="menu-item" id="menu-sounds-folder" data-i18n="menu.soundsFolder" hidden>打开声音文件夹</div>
      <div class="menu-item submenu-trigger" id="menu-language-trigger">
        <span data-i18n="menu.language">语言</span><span class="submenu-arrow">▶</span>
      </div>
      <div class="menu-divider"></div>
      <div class="menu-item" id="menu-install-hooks" data-i18n="menu.installHooks">安装 IDE 集成</div>
      <div class="menu-item" id="menu-hook-status"><span data-i18n="menu.hookStatus">Hook 状态</span><span class="menu-hint" id="hook-status-hint">未检查</span></div>
      <div class="menu-divider"></div>
      <div class="menu-item danger" id="menu-quit" data-i18n="menu.quit">退出</div>
    </div>
    <!-- 切换形象 submenu -->
    <div id="menu-model-view" class="hidden">
      <div class="menu-item submenu-back" id="menu-model-back">
        <span class="submenu-arrow back">◀</span><span data-i18n="menu.back">返回</span>
      </div>
      <div class="menu-label" data-i18n="menu.switchModel">切换形象</div>
      <div class="menu-item" id="menu-new-character" data-i18n="menu.newCharacter">+ 新建形象</div>
      <div id="char-create-inline" class="hidden">
        <div class="char-inline-row">
          <input type="text" id="char-create-input" maxlength="20" placeholder="请输入名称" autocomplete="off" />
          <span class="char-inline-btn ok" id="char-create-ok">✓</span>
          <span class="char-inline-btn cancel" id="char-create-cancel">✕</span>
        </div>
      </div>
      <div class="menu-divider"></div>
      <div id="character-grid"><!-- character cards populated dynamically --></div>
    </div>
    <!-- 播放动作 submenu -->
    <div id="menu-motion-view" class="hidden">
      <div class="menu-item submenu-back" id="menu-motion-back">
        <span class="submenu-arrow back">◀</span><span data-i18n="menu.back">返回</span>
      </div>
      <div class="menu-label" id="motion-view-label" data-i18n="menu.playMotion">播放动作</div>
      <div id="motion-list"><!-- motion items populated dynamically --></div>
    </div>
    <!-- 动作设定 submenu -->
    <div id="menu-settings-view" class="hidden">
      <div class="menu-item submenu-back" id="menu-settings-back">
        <span class="submenu-arrow back">◀</span><span data-i18n="menu.back">返回</span>
      </div>
      <div class="menu-label" data-i18n="menu.actionSettings">动作设定</div>
      <div class="menu-item submenu-trigger settings-row" id="settings-sleeping">
        <span class="settings-state-label" data-i18n="settings.sleeping">空闲中</span>
        <span class="settings-state-name" id="settings-sleeping-name">哈欠</span>
        <span class="submenu-arrow">▶</span>
      </div>
      <div class="menu-item submenu-trigger settings-row" id="settings-working">
        <span class="settings-state-label" data-i18n="settings.working">忙碌中</span>
        <span class="settings-state-name" id="settings-working-name">走路</span>
        <span class="submenu-arrow">▶</span>
      </div>
      <div class="menu-item submenu-trigger settings-row" id="settings-alert">
        <span class="settings-state-label" data-i18n="settings.alert">需要确认</span>
        <span class="settings-state-name" id="settings-alert-name">yeah</span>
        <span class="submenu-arrow">▶</span>
      </div>
      <div class="menu-divider"></div>
      <div class="menu-item" id="menu-test-alert" data-i18n="menu.previewAlert">预览提醒效果</div>
    </div>
    <!-- 编辑形象 submenu -->
    <div id="menu-char-edit-view" class="hidden">
      <div class="menu-item submenu-back" id="menu-char-edit-back">
        <span class="submenu-arrow back">◀</span><span data-i18n="menu.back">返回</span>
      </div>
      <div class="menu-label" id="char-edit-title" data-i18n="menu.editCharacter">编辑形象</div>
      <div class="menu-item" id="char-edit-sleeping">
        <span data-i18n="settings.sleeping">空闲中</span>
        <span class="menu-hint" id="char-edit-sleeping-hint">上传</span>
      </div>
      <div class="menu-item" id="char-edit-working">
        <span data-i18n="settings.working">忙碌中</span>
        <span class="menu-hint" id="char-edit-working-hint">上传</span>
      </div>
      <div class="menu-item" id="char-edit-alert">
        <span data-i18n="settings.alert">需要确认</span>
        <span class="menu-hint" id="char-edit-alert-hint">上传</span>
      </div>
      <div class="menu-divider"></div>
      <div class="menu-item danger" id="char-edit-delete" data-i18n="menu.deleteCharacter">删除形象</div>
    </div>
    <!-- 语言 submenu -->
    <div id="menu-language-view" class="hidden">
      <div class="menu-item submenu-back" id="menu-language-back">
        <span class="submenu-arrow back">◀</span><span data-i18n="menu.back">返回</span>
      </div>
      <div class="menu-label" data-i18n="menu.language">语言</div>
      <div id="language-list"><!-- language items populated dynamically --></div>
    </div>
  </div>
  <!-- Try local first, fallback to CDN -->
  <script>
    // Dynamic script loader with fallback
    function loadScript(localPath, cdnUrl) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = localPath;
        script.onload = () => resolve();
        script.onerror = () => {
          if (window.__petSendLog) window.__petSendLog('warn', '[lib] FAIL local ' + localPath + ' → CDN ' + cdnUrl);
          // Try CDN
          const cdnScript = document.createElement('script');
          cdnScript.src = cdnUrl;
          cdnScript.onload = () => resolve();
          cdnScript.onerror = () => {
            if (window.__petSendLog) window.__petSendLog('error', '[lib] FAIL CDN ' + cdnUrl);
            reject(new Error('Failed to load: ' + cdnUrl));
          };
          document.head.appendChild(cdnScript);
        };
        document.head.appendChild(script);
      });
    }

    async function loadAllLibs() {
      // Menu mode: skip all Live2D/PixiJS libraries — the menu window only
      // needs i18n + renderer.js (which runs in menu-only mode via the
      // __MENU_MODE__ flag injected by Rust's initialization_script).
      if (window.__MENU_MODE__) {
        window.dispatchEvent(new CustomEvent('libs-ready'));
        return;
      }
      // PixiJS and Cubism Core have no interdependency — load in parallel
      await Promise.all([
        loadScript(
          'lib/pixi.min.js',
          'https://cdn.jsdelivr.net/npm/pixi.js@7.4.0/dist/pixi.min.js'
        ),
        loadScript(
          'lib/live2dcubismcore.min.js',
          'https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js'
        )
      ]);
      // pixi-live2d-display depends on both PixiJS and Cubism Core.
      // Use the Cubism 4 only build — the combined index.min.js throws
      // "Could not find Cubism 2 runtime" if live2d.min.js is absent, which
      // aborts registration of PIXI.live2d.Live2DModel. Our models are all
      // Cubism 4 (.moc3), so cubism4.min.js is sufficient.
      await loadScript(
        'lib/cubism4.min.js',
        'https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js'
      );

      window.dispatchEvent(new CustomEvent('libs-ready'));
    }

    loadAllLibs().catch(err => {
      if (window.__petSendLog) window.__petSendLog('error', '[libs] FAILED: ' + (err && err.message ? err.message : err));
      // Start with fallback mode
      window.dispatchEvent(new CustomEvent('libs-failed'));
    });
  </script>

  <!-- i18n module (must load before renderer.js so window.i18n is available) -->
  <script src="i18n.js?v=2"></script>
  <!-- Tauri bridge: implements window.petAPI via the Tauri global API.
       Must load before renderer.js (which uses window.petAPI at init). -->
  <script src="tauri-bridge.js?v=2"></script>
  <!-- Main renderer script -->
  <script src="renderer.js?v=2"></script>
</body>
</html>
