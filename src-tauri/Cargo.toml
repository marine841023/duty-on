[package]
name = "duty-on"
version = "1.1.8"
description = "Live2D desktop pet for monitoring Trae IDE AI task status"
authors = ["DutyOn"]
edition = "2021"

[lib]
name = "duty_on_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
sysinfo = "0.30"
tokio-stream = { version = "0.1", features = ["sync"] }
once_cell = "1"
dirs = "5"
regex = "1"
log = "0.4"
env_logger = "0.11"
sys-locale = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
] }

# macOS: CoreGraphics CGEvent (cursor position) + CGWindowList FFI (window enum)
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"

# Linux: X11 cursor position (XQueryPointer) + window enumeration (XQueryTree).
# Wayland has no global cursor/window APIs — connection failure is the detector.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
