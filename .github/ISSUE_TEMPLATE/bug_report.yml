name: Bug Report / 缺陷报告
description: Something isn't working / 某些功能不正常
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! 中英文填写都可以。
  - type: input
    id: version
    attributes:
      label: App version / 应用版本
      placeholder: e.g. 2.0.13 / source commit SHA
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / 操作系统
      placeholder: e.g. Windows 11 / ARM Linux (board + distribution); include IDE and version for Hook issues
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened? / 发生了什么？
      description: Steps to reproduce + what you expected.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / 日志
      description: Relevant lines from ~/.dutyon/frontend.log; for Hook issues also hooks/bridge.log and hook-received.log. Remove private paths, prompts and credentials before sharing.
      render: text
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues first / 已搜索过现有 Issue
          required: true
