name: Feature Request / 功能建议
description: Suggest an idea / 提个想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve? / 解决什么痛点？
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution / 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / 考虑过的替代方案
