name: build

# Runs tests on every push/PR; builds and publishes a GitHub Release when a
# version tag (v*) is pushed. Windows-first; macOS/Linux entries are ready to
# uncomment when you have time to validate them.

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Run unit tests
        run: cargo test
        working-directory: src-tauri

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2.0" --locked
      - name: Build NSIS installer
        run: cargo tauri build
        working-directory: src-tauri
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*-setup.exe
          generate_release_notes: true
          body: |
            ## What's new

            ### Features
            - Head effects (halo, speech bubble, prompt icon) now adapt their anchor and size to any character model
            - Motion dropdown is populated dynamically by scanning each character's model file; newly downloaded characters work without restarting the app
            - Per-character default motion settings: idle/busy/alert picks are stored per model and loaded automatically when switching characters (old config is auto-migrated)

            ### Bug Fixes
            - Fixed custom models with unusual canvas sizes (e.g. shizuku) rendering off-screen or at a wrong scale: models are now fitted to their content bounding box, refined after the first rendered frame
            - Fixed models using clipping masks (e.g. shizuku) collapsing to a single mouth piece when horizontal flipping was on: flipping is now done via CSS on the canvas instead of a negative scale

            ### Tested
            - 64 unit tests passing

