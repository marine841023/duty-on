name: build

# Runs tests on every push/PR; builds and publishes a GitHub Release when a
# version tag (v*) is pushed. Windows-first; macOS/Linux entries are ready to
# uncomment when you have time to validate them.

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Run unit tests
        run: cargo test
        working-directory: src-tauri

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2.0" --locked
      - name: Build NSIS installer
        run: cargo tauri build
        working-directory: src-tauri
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*-setup.exe
          generate_release_notes: true
          body: |
            ## v1.1.9 — 多屏吸附修复

            ### Bug Fixes
            - **跨屏吸附横跳消失问题**：修复 1 号屏 (DPI 1.25) 与 2 号屏 (DPI 1.0) 边界吸附时窗口在两个屏幕间反复跳动最终消失的故障
              - `snap_target` 改用 "最大面积优先" 算法确定主屏幕，只在窗口过半进入邻屏时才翻转
              - 内部边界规范化：右侧若有邻接屏幕，自动转换为邻屏的 left edge，确保同一物理边界返回一致结果
              - DPI 来源从窗口改为目标显示器，避免跨屏 bar 尺寸计算错误
              - `enter_edge_dock` 先设置 active 状态再调整窗口尺寸/位置，消除竞态
              - 预览条添加 20px hysteresis，防止阈值附近闪烁

            ### Features
            - **Live2D 封面生成器**：通过 `docs/cover-generator.html` 可利用现有 Live2D 形象导出封面图（1600×900 PNG，约 1.4MB）
            - 启动时打印所有显示器信息（位置、尺寸、DPI）便于排查多屏问题

