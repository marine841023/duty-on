name: build

# Runs tests on every push/PR; builds and publishes a GitHub Release when a
# version tag (v*) is pushed. Windows-first; macOS/Linux entries are ready to
# uncomment when you have time to validate them.

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Run unit tests
        run: cargo test
        working-directory: src-tauri

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2.0" --locked
      - name: Build NSIS installer
        run: cargo tauri build
        working-directory: src-tauri
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*-setup.exe
          generate_release_notes: true
          body: |
            ## What's new

            ### Bug Fixes
            - Fixed window scanning hanging when a busy CMD/console window is open: title reads now filter by IDE process name first (pure kernel query, never hangs) and fall back to a 250 ms timed read (`SendMessageTimeoutW`), so IDE status keeps updating in real time even while a long-running command executes
            - Fixed Qoder sessions being dropped when the IDE window title temporarily changes to a non-standard format (e.g. installer dialogs): windows of the same IDE kind now suppress the miss grace countdown

            ### Housekeeping
            - Removed internal open-source ops guide; technical notes moved to `docs/technical-notes.md`
            - Synced version numbers (Cargo.toml / tauri.conf.json) to 1.1.1

            ### Tested
            - 64 unit tests passing

