name: build

# Runs tests on every push/PR; builds and publishes a GitHub Release when a
# version tag (v*) is pushed. Windows-first; macOS/Linux entries are ready to
# uncomment when you have time to validate them.

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Run unit tests
        run: cargo test
        working-directory: src-tauri

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2.0" --locked
      - name: Build NSIS installer
        run: cargo tauri build
        working-directory: src-tauri
      # Package the NSIS installer into a ZIP. Direct .exe downloads trigger
      # Windows Defender SmartScreen (unsigned + no reputation); a .zip
      # archive bypasses the download-time warning. Users download the zip,
      # extract it, then run the installer inside.
      - name: Package installer into ZIP
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $zip = "src-tauri/target/release/bundle/DutyOn-${{ github.ref_name }}.zip"
          Compress-Archive -Path $exe.FullName -DestinationPath $zip -Force
          $sizeMB = [math]::Round((Get-Item $zip).Length / 1MB, 2)
          Write-Host "Packaged $($exe.Name) -> $zip ($sizeMB MB)"
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/DutyOn-*.zip
          generate_release_notes: true
          body: |
            ## v1.3.1 — 系统监控面板

            > **安装方式**：下载 `.zip` 压缩包，解压后运行里面的 `DutyOn_1.3.1_x64-setup.exe` 安装。

            ### 新功能
            - **系统监控面板**：实时显示 CPU / 内存 / GPU / 网络 / 程序自身占用，与任务窗格风格统一（状态边框颜色同步）
            - 监控面板可整体显示/隐藏、可折叠，各指标可单独开关；**默认隐藏**，右键菜单开启
            - 隐藏项目列表时不再连带隐藏系统监控

            ### 修复
            - 修复系统监控面板隐藏后窗口高度未收缩的问题
            - 修复系统监控面板无法点击（被误判为穿透区域）的问题
            - 修复忙碌等状态下监控面板缺少状态边框颜色的问题

